<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f766e">
    <title>Candidatos - Lojão Super 20</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="page-shell admin-shell">
      <section id="loginPanel" class="panel form-card">
        <p class="eyebrow">Área administrativa</p>
        <h1>Candidatos</h1>
        <p class="muted-text">Entre com seu usuário administrador para ver os currículos recebidos.</p>
        <label>E-mail
          <input id="adminEmail" type="email" autocomplete="email" placeholder="seu@email.com" required>
        </label>
        <label>Senha
          <input id="adminPassword" type="password" autocomplete="current-password" placeholder="Sua senha" required>
        </label>
        <button id="adminLogin" type="button" class="primary-action">Entrar</button>
        <p id="loginStatus" class="form-status" role="status"></p>
      </section>

      <section id="dashboardPanel" class="admin-dashboard" hidden>
        <section class="hero panel">
          <div>
            <p class="eyebrow">Seleção</p>
            <h1>Currículos recebidos</h1>
            <p id="adminSummary">Carregando candidatos...</p>
          </div>
          <button id="logoutButton" type="button" class="secondary-action">Sair</button>
        </section>

        <section class="panel form-card">
          <label>Pesquisar candidato
            <input id="candidateSearch" type="search" placeholder="Nome, WhatsApp, cidade ou cargo">
          </label>
          <div id="emptyState" class="empty-state">Nenhum candidato encontrado.</div>
          <div id="candidateList" class="candidate-list"></div>
        </section>
      </section>
    </main>

    <template id="candidateTemplate">
      <article class="candidate-card">
        <div class="candidate-photo"></div>
        <div class="candidate-info">
          <div class="candidate-title">
            <h2></h2>
            <span class="status-pill"></span>
          </div>
          <p class="candidate-role"></p>
          <dl class="candidate-details"></dl>
          <p class="candidate-experience"></p>
          <p class="candidate-notes"></p>
        </div>
      </article>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
    <script src="admin.js"></script>
  </body>
</html>
